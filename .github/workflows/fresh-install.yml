name: fresh-install

# THE test that was missing (external audit, 2026-09-23). Every release note since 2.1.0 said "fresh
# installs work"; every one of those measurements was made on the author's machine, where ~/.claude already
# held hooks, 40 plugins, policy files and the canonical template. A real user has none of that. This job
# installs the product exactly the way a stranger does — into an EMPTY directory, with an EMPTY home — and
# then asks the tool's own doctor whether it is green. If this job is red, the release is not shippable,
# whatever the source-tree doctor says.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-install:
    name: install into an empty dir with an empty HOME → doctor ALL GREEN
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '22']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # An EMPTY home is the point. Both the POSIX and the Windows home variables are redirected so
      # os.homedir() resolves to a directory nothing has ever written to.
      - name: Prepare an empty HOME and an empty target project (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/empty-home" "$RUNNER_TEMP/fresh-project"
          cd "$RUNNER_TEMP/fresh-project" && git init -q && echo "# fresh" > README.md
          echo "FORGE_TEST_HOME=$RUNNER_TEMP/empty-home" >> "$GITHUB_ENV"
          echo "FORGE_TEST_PROJECT=$RUNNER_TEMP/fresh-project" >> "$GITHUB_ENV"

      - name: Prepare an empty HOME and an empty target project (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # ($HOME is a read-only automatic variable in PowerShell — the first 2.4.0 run died on `$home = …`.)
          $emptyHome = Join-Path $env:RUNNER_TEMP 'empty-home'
          $proj = Join-Path $env:RUNNER_TEMP 'fresh-project'
          New-Item -ItemType Directory -Force $emptyHome | Out-Null
          New-Item -ItemType Directory -Force $proj | Out-Null
          Set-Location $proj; git init -q; Set-Content README.md '# fresh'
          "FORGE_TEST_HOME=$emptyHome" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "FORGE_TEST_PROJECT=$proj" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # The installer, exactly as documented. Full install (global + project), because that is what
      # AI-INSTALL.md tells an assistant to run — the global part must land in the EMPTY home too.
      - name: Install with install.sh (POSIX)
        if: runner.os != 'Windows'
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
        run: bash install.sh --project "$FORGE_TEST_PROJECT" --yes

      - name: Install with install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
          USERPROFILE: ${{ env.FORGE_TEST_HOME }}
        run: powershell -ExecutionPolicy Bypass -File .\install.ps1 -ProjectDir "$env:FORGE_TEST_PROJECT" -Yes

      # What the installer promised: the two root files, the global core, and the canonical template.
      - name: The install delivered what it documents
        shell: bash
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
          USERPROFILE: ${{ env.FORGE_TEST_HOME }}
        run: |
          set -e
          p="$FORGE_TEST_PROJECT"; h="$FORGE_TEST_HOME"
          for f in "$p/CLAUDE.md" "$p/.gitignore" "$p/.claude/forge-bin/forge-doctor.cjs" "$p/.claude/forge-bin/forge-setup.cjs" "$p/.claude/settings.json" "$p/.claude/skills/forge-prd/SKILL.md" \
                   "$h/.claude/skills/forge-core/SKILL.md" "$h/.claude/forge/template/.claude/forge-bin/forge-sync.cjs" "$h/.claude/forge/template/CLAUDE.md"; do
            if [ -f "$f" ]; then echo "ok   $f"; else echo "::error::missing after install: $f"; exit 1; fi
          done
          # The settings.json PostToolUse hook must carry a matcher (no per-tool-call logging flood).
          node -e '
            const j = require(process.argv[1] + "/.claude/settings.json");
            const post = (j.hooks && j.hooks.PostToolUse) || [];
            const bad = post.filter((e) => e.matcher === undefined || e.matcher === "");
            if (bad.length) { console.error("::error::PostToolUse hook without a matcher ships in settings.json"); process.exit(1); }
            console.log("ok   PostToolUse hooks all carry a matcher (" + post.length + ")");
          ' "$p"

      # Running the installer twice must change nothing: proves merge-safety and idempotence.
      - name: Second install is a no-op (POSIX)
        if: runner.os != 'Windows'
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
        run: |
          set -e
          before=$(find "$FORGE_TEST_PROJECT" -type f -newer README.md 2>/dev/null | wc -l)
          gi_before=$(wc -l < "$FORGE_TEST_PROJECT/.gitignore")
          bash install.sh --project "$FORGE_TEST_PROJECT" --yes | grep -E "kept:|wrote:.*(CLAUDE|gitignore)" | tail -3
          gi_after=$(wc -l < "$FORGE_TEST_PROJECT/.gitignore")
          [ "$gi_before" = "$gi_after" ] || { echo "::error::.gitignore grew on a second install ($gi_before -> $gi_after)"; exit 1; }
          echo "ok   idempotent (.gitignore stayed at $gi_after lines)"

      # The one check that matters: the tool's own full self-test, on the fresh install, with the empty
      # home still in effect. ALL GREEN or the job is red.
      # v2.7.0: everything is ON by default, including the usage guard (pause at 98%). The empty HOME above already
      # keeps every home-derived path away from a real account; these two seams make that explicit for the two tools
      # that would otherwise spawn a background watcher or read a settings file (forge-config.cjs / usage-guard.cjs).
      - name: forge-doctor on the fresh install (empty HOME)
        shell: bash
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
          USERPROFILE: ${{ env.FORGE_TEST_HOME }}
          FORGE_CONFIG_HOME: ${{ env.FORGE_TEST_HOME }}/.claude
          FORGE_USAGE_GUARD_HOME: ${{ env.FORGE_TEST_HOME }}/.claude
        run: |
          set -e
          cd "$FORGE_TEST_PROJECT"
          node .claude/forge-bin/forge-doctor.cjs --root . | tee doctor.txt
          grep -q "⇒ ALL GREEN" doctor.txt || { echo "::error::the fresh-install doctor is not ALL GREEN — see the ✗ lines above"; exit 1; }

      # Diagnostics only: the doctor names the red suites; this re-runs exactly those and prints their FAIL lines,
      # so a runner-only failure (Windows/Linux, Node 18/22) can be read from the log instead of guessed at.
      - name: Re-run the red suites and print their failures (diagnostics)
        if: failure()
        shell: bash
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
          USERPROFILE: ${{ env.FORGE_TEST_HOME }}
        run: |
          set +e   # the default shell runs with -e: a red suite (exit 1) must not abort the diagnostics that explain it
          cd "$FORGE_TEST_PROJECT" || exit 0
          [ -f doctor.txt ] || { echo "no doctor.txt — the failure happened before the doctor ran"; exit 0; }
          names=$(grep -oE "[A-Za-z0-9_-]+\.test\.cjs \([^)]*\)" doctor.txt | sed -E 's/ \(.*//' | sort -u)
          [ -n "$names" ] || { echo "the doctor named no red suite"; exit 0; }
          for s in $names; do
            echo "===== $s (node $(node --version), $(uname -s)) ====="
            node ".claude/forge-bin/$s" > "suite-$s.log" 2>&1; echo "exit=$?"
            grep -nE "FAIL|Error|error:|passed, [0-9]+ failed|SKIP|timed out|ETIMEDOUT|EPERM|EBUSY|EACCES" "suite-$s.log" | head -60
            echo "----- last 25 lines -----"; tail -25 "suite-$s.log"
          done

      # /setup-forge's engine and the sync status must both work on a machine that has only what the
      # installer put there.
      - name: Setup engine and sync status work from the fresh install
        shell: bash
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
          USERPROFILE: ${{ env.FORGE_TEST_HOME }}
        run: |
          set -e
          cd "$FORGE_TEST_PROJECT"
          node .claude/forge-bin/forge-setup.cjs --help >/dev/null 2>&1 || node .claude/forge-bin/forge-setup.cjs doctor >/dev/null 2>&1 || { echo "::error::forge-setup.cjs does not start"; exit 1; }
          echo "ok   forge-setup.cjs starts"
          out=$(node .claude/forge-bin/forge-sync.cjs status . 2>&1 || true)
          echo "$out" | head -3
          echo "$out" | grep -qiE "up to date|DRIFT" || { echo "::error::forge-sync status did not find the canonical template the installer just created"; exit 1; }
          echo "ok   forge-sync compares against the installed canonical template"
          # The installer must record the release it installed (2.3.0 shipped a stale marker; 2.4.0 writes the real one).
          want="installed=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")"
          echo "$out" | grep -qF "$want" || { echo "::error::forge-sync status does not report $want (FORGE_VERSION.json missing or stale)"; exit 1; }
          echo "ok   $want"

      # Pipe-mode smoke (review HIGH #2/#8, security #10): `curl | bash` must ALWAYS install from the
      # downloaded archive, never from whatever happens to already be in the piped-into directory. This
      # fetches install.sh straight from raw.githubusercontent.com exactly like the documented one-liner
      # — no local checkout of the script is used, so BASH_SOURCE is genuinely empty here, unlike every
      # other step in this job which runs `bash install.sh` from the checked-out repo.
      # NOTE: raw.githubusercontent.com/.../main/install.sh is the commit under test only once this fix
      # has actually been merged to main (a `push` trigger runs after that merge lands; a `pull_request`
      # run fetches whatever is on main right now, which may still be the pre-fix installer). That gap is
      # accepted — a pre-merge version mismatch here is a known limitation of testing a true "no script on
      # disk" pipe install from a still-unmerged branch, not a regression in this branch's install.sh.
      - name: Piped install smoke (curl | bash) into a fresh project (POSIX)
        if: runner.os != 'Windows'
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/piped-project"
          cd "$RUNNER_TEMP/piped-project"
          curl -fsSL https://raw.githubusercontent.com/ForgeyClap/claude-forge/main/install.sh | FORGE_YES=1 bash
          [ -f ".claude/forge-bin/forge-doctor.cjs" ] || { echo "::error::piped install did not deliver .claude/forge-bin/forge-doctor.cjs"; exit 1; }
          [ -f ".claude/FORGE_VERSION.json" ] || { echo "::error::piped install did not write .claude/FORGE_VERSION.json"; exit 1; }
          want="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")"
          got="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".claude/FORGE_VERSION.json","utf8")).forge_version)')"
          [ "$got" = "$want" ] || { echo "::error::piped install reported version $got, expected $want (see the NOTE above on raw-main lag before merge)"; exit 1; }
          echo "ok   piped install delivered forge-doctor.cjs + FORGE_VERSION.json ($got)"

      # HOME-guard check (review HIGH #3): the installer must refuse to write the PROJECT payload into
      # $HOME itself — a one-liner run from the home directory (e.g. the Windows %USERPROFILE% prompt)
      # must never replace the user's global settings.json. Non-zero exit AND no project payload written
      # into the empty HOME's .claude is the contract; forge-bin only ever ships in the project payload,
      # never in the global core, so its absence there proves the project install never ran.
      - name: HOME-guard refuses --project pointing at $HOME (POSIX)
        if: runner.os != 'Windows'
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
        run: |
          set +e   # non-zero exit here is the expected, asserted outcome — must not abort the script
          bash install.sh --project "$FORGE_TEST_HOME" --yes
          status=$?
          set -e
          [ "$status" -ne 0 ] || { echo "::error::installer accepted --project \$HOME instead of refusing it"; exit 1; }
          [ ! -d "$FORGE_TEST_HOME/.claude/forge-bin" ] || { echo "::error::installer wrote the project payload into \$HOME/.claude despite the HOME guard"; exit 1; }
          echo "ok   installer refused --project \$HOME (exit $status, no .claude/forge-bin written there)"

      - name: HOME-guard refuses -ProjectDir pointing at $HOME (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
          USERPROFILE: ${{ env.FORGE_TEST_HOME }}
        run: |
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -ProjectDir "$env:FORGE_TEST_HOME" -Yes
          $status = $LASTEXITCODE
          if ($status -eq 0) {
            Write-Host '::error::installer accepted -ProjectDir $HOME instead of refusing it'
            exit 1
          }
          $leaked = Join-Path $env:FORGE_TEST_HOME '.claude\forge-bin'
          if (Test-Path -LiteralPath $leaked -PathType Container) {
            Write-Host '::error::installer wrote the project payload into $HOME\.claude despite the HOME guard'
            exit 1
          }
          Write-Host "ok   installer refused -ProjectDir `$HOME (exit $status, no .claude\forge-bin written there)"
          # The refusal (exit 1) is the EXPECTED outcome; GitHub's pwsh wrapper would otherwise fail the step on the
          # installer's own $LASTEXITCODE (measured on e7367fa: guard fired, "ok" printed, step still red).
          exit 0

      # settings-merge check (security #4, review #10; UPDATED wp22 / owner directive 2026-09-24 "alles
      # standaard aan"): an existing project .claude/settings.json must never be silently REPLACED, but it
      # must also no longer be left completely untouched next to a settings.forge-recommended.json (that was
      # the pre-wp22 behaviour and directly contradicted "Forge does it for you"). It is now MERGED: every
      # foreign hook entry, allow rule, and unknown top-level key survives byte-for-byte, and the template's
      # own hooks (including the gate hook) and deny rules are added.
      - name: settings.json is merged, not just kept (POSIX)
        if: runner.os != 'Windows'
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
        run: |
          set -e
          proj="$RUNNER_TEMP/settings-merge-project"
          mkdir -p "$proj/.claude"
          printf '%s' '{"hooks":{"PreToolUse":[{"matcher":"Write|Edit","hooks":[{"type":"command","command":"node \"owner-hook.cjs\""}]}]},"permissions":{"allow":["Bash(npm run build)"],"deny":["Bash(rm -rf *)"]},"ownerField":"keep me"}' > "$proj/.claude/settings.json"
          bash install.sh --project "$proj" --yes >/dev/null
          node -e '
            const s = require(process.argv[1] + "/.claude/settings.json");
            const pre = JSON.stringify(s.hooks.PreToolUse || []);
            if (!pre.includes("owner-hook.cjs")) { console.error("::error::the foreign PreToolUse hook was lost by the merge"); process.exit(1); }
            if (!pre.includes("forge-gate-hook.cjs")) { console.error("::error::the template gate hook was not merged in"); process.exit(1); }
            if (JSON.stringify(s.permissions.allow || []) !== JSON.stringify(["Bash(npm run build)"])) { console.error("::error::the foreign permissions.allow rule was lost"); process.exit(1); }
            if (!(s.permissions.deny || []).includes("Bash(rm -rf *)")) { console.error("::error::the foreign permissions.deny rule was lost"); process.exit(1); }
            if (!(s.permissions.deny || []).includes("Read(./.env)")) { console.error("::error::the template deny rules were not merged in"); process.exit(1); }
            if (s.ownerField !== "keep me") { console.error("::error::an unknown top-level key was dropped by the merge"); process.exit(1); }
            console.log("ok   settings.json merged: foreign hook/allow/deny/unknown-key kept, template gate hook + deny rules added");
          ' "$proj"
          [ -f "$proj/.claude/settings.forge-recommended.json" ] && { echo "::error::settings.forge-recommended.json should not exist when the merge succeeded"; exit 1; }
          backups=$(find "$proj/.claude" -maxdepth 1 -name 'settings.json.forge-bak-*' | wc -l)
          [ "$backups" -eq 1 ] || { echo "::error::expected exactly one settings.json backup, found $backups"; exit 1; }
          before_hash=$(sha256sum "$proj/.claude/settings.json" | cut -d' ' -f1)
          bash install.sh --project "$proj" --yes | grep -qi "already merged" || { echo "::error::a second install did not report settings.json as already merged"; exit 1; }
          after_hash=$(sha256sum "$proj/.claude/settings.json" | cut -d' ' -f1)
          [ "$before_hash" = "$after_hash" ] || { echo "::error::settings.json changed on a second, idempotent install"; exit 1; }
          backups2=$(find "$proj/.claude" -maxdepth 1 -name 'settings.json.forge-bak-*' | wc -l)
          [ "$backups2" -eq 1 ] || { echo "::error::a no-op second install must not take a new backup (found $backups2)"; exit 1; }
          echo "ok   second install is a true no-op (byte-identical, no new backup)"

      - name: settings.json is merged, not just kept (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
          USERPROFILE: ${{ env.FORGE_TEST_HOME }}
        run: |
          $proj = Join-Path $env:RUNNER_TEMP 'settings-merge-project'
          New-Item -ItemType Directory -Force (Join-Path $proj '.claude') | Out-Null
          $settingsPath = Join-Path $proj '.claude\settings.json'
          $fixture = '{"hooks":{"PreToolUse":[{"matcher":"Write|Edit","hooks":[{"type":"command","command":"node owner-hook.cjs"}]}]},"permissions":{"allow":["Bash(npm run build)"],"deny":["Bash(rm -rf *)"]},"ownerField":"keep me"}'
          [System.IO.File]::WriteAllText($settingsPath, $fixture, (New-Object System.Text.UTF8Encoding $false))
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -ProjectDir $proj -Yes | Out-Null
          $s = Get-Content -Raw -LiteralPath $settingsPath | ConvertFrom-Json
          $preJson = ($s.hooks.PreToolUse | ConvertTo-Json -Depth 10)
          if ($preJson -notmatch 'owner-hook\.cjs') { Write-Host '::error::the foreign PreToolUse hook was lost by the merge'; exit 1 }
          if ($preJson -notmatch 'forge-gate-hook\.cjs') { Write-Host '::error::the template gate hook was not merged in'; exit 1 }
          if (($s.permissions.allow -join ',') -ne 'Bash(npm run build)') { Write-Host '::error::the foreign permissions.allow rule was lost'; exit 1 }
          if ($s.permissions.deny -notcontains 'Bash(rm -rf *)') { Write-Host '::error::the foreign permissions.deny rule was lost'; exit 1 }
          if ($s.permissions.deny -notcontains 'Read(./.env)') { Write-Host '::error::the template deny rules were not merged in'; exit 1 }
          if ($s.ownerField -ne 'keep me') { Write-Host '::error::an unknown top-level key was dropped by the merge'; exit 1 }
          Write-Host 'ok   settings.json merged: foreign hook/allow/deny/unknown-key kept, template gate hook + deny rules added'
          $recommended = Join-Path $proj '.claude\settings.forge-recommended.json'
          if (Test-Path -LiteralPath $recommended -PathType Leaf) { Write-Host '::error::settings.forge-recommended.json should not exist when the merge succeeded'; exit 1 }
          $backups = Get-ChildItem -LiteralPath (Join-Path $proj '.claude') -Filter 'settings.json.forge-bak-*'
          if ($backups.Count -ne 1) { Write-Host "::error::expected exactly one settings.json backup, found $($backups.Count)"; exit 1 }
          $beforeHash = (Get-FileHash -LiteralPath $settingsPath -Algorithm SHA256).Hash
          $out = powershell -ExecutionPolicy Bypass -File .\install.ps1 -ProjectDir $proj -Yes
          if (($out -join "`n") -notmatch '(?i)already merged') { Write-Host '::error::a second install did not report settings.json as already merged'; exit 1 }
          $afterHash = (Get-FileHash -LiteralPath $settingsPath -Algorithm SHA256).Hash
          if ($beforeHash -ne $afterHash) { Write-Host '::error::settings.json changed on a second, idempotent install'; exit 1 }
          $backups2 = Get-ChildItem -LiteralPath (Join-Path $proj '.claude') -Filter 'settings.json.forge-bak-*'
          if ($backups2.Count -ne 1) { Write-Host "::error::a no-op second install must not take a new backup (found $($backups2.Count))"; exit 1 }
          Write-Host 'ok   second install is a true no-op (byte-identical, no new backup)'

      # UNSAFE-FIRST-COPY (wp-f2, 2026-09-24 Codex re-check): a settings.json that is a DIRECTORY (not a
      # file) must be REFUSED, never `cp`/Copy-Item'd INTO (which would nest the payload's settings.json
      # inside it while reporting success). No nested file, and (POSIX) a non-zero exit.
      - name: settings.json as a DIRECTORY refuses cleanly, no nested file (POSIX)
        if: runner.os != 'Windows'
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
        run: |
          set +e   # the refusal's non-zero exit is the expected, asserted outcome
          proj="$RUNNER_TEMP/settings-dir-project"
          mkdir -p "$proj/.claude/settings.json"
          bash install.sh --project "$proj" --yes
          status=$?
          set -e
          [ "$status" -ne 0 ] || { echo "::error::install.sh accepted a directory-shaped settings.json instead of refusing it"; exit 1; }
          entries=$(find "$proj/.claude/settings.json" -mindepth 1 | wc -l)
          [ "$entries" -eq 0 ] || { echo "::error::something was nested inside the settings.json directory (found $entries entr(y/ies))"; exit 1; }
          [ -d "$proj/.claude/settings.json" ] || { echo "::error::settings.json is no longer a directory — it should never have been touched"; exit 1; }
          # the fallback is stamped (settings.forge-recommended-<stamp>-<rand>.json): match the family, not one fixed name
          rec=$(find "$proj/.claude" -maxdepth 1 -name 'settings.forge-recommended*.json' | head -1)
          [ -z "$rec" ] || { echo "::error::a recommended-file fallback should not exist either — this is a hard refusal (found $rec)"; exit 1; }
          [ -f "$proj/.claude/forge-bin/forge-doctor.cjs" ] || { echo "::error::every OTHER payload file should still install even though settings.json was refused"; exit 1; }
          echo "ok   install.sh refused the directory-shaped settings.json (exit $status), nested nothing, everything else still installed"

      - name: settings.json as a DIRECTORY refuses cleanly, no nested file (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
          USERPROFILE: ${{ env.FORGE_TEST_HOME }}
        run: |
          $proj = Join-Path $env:RUNNER_TEMP 'settings-dir-project'
          $settingsDir = Join-Path $proj '.claude\settings.json'
          New-Item -ItemType Directory -Force $settingsDir | Out-Null
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -ProjectDir $proj -Yes
          # v2.8.0: capture + assert the refusal's exit code (the POSIX step always did). The installer exits
          # non-zero BY DESIGN here; without an explicit `exit 0` below, pwsh ends the step with that leftover
          # $LASTEXITCODE and the job fails even though every assertion passed (the v2.7.2 Windows/Node 18 red).
          $status = $LASTEXITCODE
          if ($status -eq 0) { Write-Host '::error::install.ps1 accepted a directory-shaped settings.json instead of refusing it'; exit 1 }
          if (-not (Test-Path -LiteralPath $settingsDir -PathType Container)) { Write-Host '::error::settings.json is no longer a directory -- it should never have been touched'; exit 1 }
          $entries = Get-ChildItem -LiteralPath $settingsDir -Force
          if ($entries.Count -ne 0) { Write-Host "::error::something was nested inside the settings.json directory (found $($entries.Count) entr(y/ies))"; exit 1 }
          # The fallback file is written with a stamp (settings.forge-recommended-<stamp>-<rand>.json), so match the
          # whole family -- a fixed-name check could never fail.
          $recommended = @(Get-ChildItem -LiteralPath (Join-Path $proj '.claude') -Filter 'settings.forge-recommended*.json' -File -ErrorAction SilentlyContinue)
          if ($recommended.Count -ne 0) { Write-Host "::error::a recommended-file fallback should not exist either -- this is a hard refusal (found $($recommended[0].Name))"; exit 1 }
          $doctorPath = Join-Path $proj '.claude\forge-bin\forge-doctor.cjs'
          if (-not (Test-Path -LiteralPath $doctorPath -PathType Leaf)) { Write-Host '::error::every OTHER payload file should still install even though settings.json was refused'; exit 1 }
          Write-Host "ok   install.ps1 refused the directory-shaped settings.json (exit $status), nested nothing, everything else still installed"
          exit 0

      # v2.8.0 (WP-D1, laptop re-audit "Part IX #12" / "there is no uninstaller"): --uninstall / -Uninstall
      # must remove exactly what THIS install wrote (verified by hash), and nothing a user added or edited.
      - name: --uninstall removes exactly what it wrote, keeps user files, is idempotent (POSIX)
        if: runner.os != 'Windows'
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
        run: |
          set -e
          proj="$RUNNER_TEMP/uninstall-project"
          mkdir -p "$proj"
          bash install.sh --project "$proj" --yes >/dev/null
          [ -d "$proj/.claude/forge-bin" ] || { echo "::error::install did not create .claude/forge-bin -- nothing to test uninstall against"; exit 1; }
          # a file the USER created after install (Forge never wrote this path)
          printf 'my own notes\n' > "$proj/.claude/MY_OWN_NOTES.md"
          # a payload file the user EDITED after install -- must survive because its hash no longer
          # matches what the installer recorded (outside forge-bin, so forge-bin itself can still go to zero)
          edited="$proj/.claude/skills/forge-prd/SKILL.md"
          [ -f "$edited" ] || { echo "::error::fixture assumption broken: $edited does not exist after install"; exit 1; }
          printf '\n<!-- my own edit, kept across uninstall -->\n' >> "$edited"
          # the user's OWN .gitignore line, next to Forge's own appended block
          printf 'my-own-ignore-rule/\n' >> "$proj/.gitignore"
          bash install.sh --uninstall --project "$proj" --yes
          [ ! -d "$proj/.claude/forge-bin" ] || { echo "::error::.claude/forge-bin still exists after --uninstall"; exit 1; }
          echo "ok   .claude/forge-bin is gone"
          [ -f "$proj/.claude/MY_OWN_NOTES.md" ] || { echo "::error::a file the user created was deleted by --uninstall"; exit 1; }
          echo "ok   the user-created file survived"
          grep -qF 'my own edit, kept across uninstall' "$edited" || { echo "::error::the user-edited payload file was deleted or reverted by --uninstall"; exit 1; }
          echo "ok   the user-edited payload file survived, unchanged"
          grep -qxF '.claude/forge-runs/*/*' "$proj/.gitignore" && { echo "::error::a Forge-added .gitignore line survived --uninstall"; exit 1; }
          grep -qxF 'my-own-ignore-rule/' "$proj/.gitignore" || { echo "::error::the user's own .gitignore line was removed by --uninstall"; exit 1; }
          echo "ok   Forge's .gitignore lines are gone, the user's own line stayed"
          before=$(find "$proj/.claude" -type f 2>/dev/null | sort)
          bash install.sh --uninstall --project "$proj" --yes >/dev/null
          after=$(find "$proj/.claude" -type f 2>/dev/null | sort)
          [ "$before" = "$after" ] || { echo "::error::a second --uninstall changed the file set (not idempotent)"; exit 1; }
          echo "ok   a second --uninstall is a no-op"

      - name: -Uninstall removes exactly what it wrote, keeps user files, is idempotent (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
          USERPROFILE: ${{ env.FORGE_TEST_HOME }}
        run: |
          $proj = Join-Path $env:RUNNER_TEMP 'uninstall-project'
          New-Item -ItemType Directory -Force $proj | Out-Null
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -ProjectDir $proj -Yes | Out-Null
          $forgeBin = Join-Path $proj '.claude\forge-bin'
          if (-not (Test-Path -LiteralPath $forgeBin -PathType Container)) { Write-Host '::error::install did not create .claude\forge-bin -- nothing to test uninstall against'; exit 1 }
          $notes = Join-Path $proj '.claude\MY_OWN_NOTES.md'
          Set-Content -LiteralPath $notes -Value 'my own notes'
          $edited = Join-Path $proj '.claude\skills\forge-prd\SKILL.md'
          if (-not (Test-Path -LiteralPath $edited -PathType Leaf)) { Write-Host "::error::fixture assumption broken: $edited does not exist after install"; exit 1 }
          Add-Content -LiteralPath $edited -Value "`n<!-- my own edit, kept across uninstall -->"
          Add-Content -LiteralPath (Join-Path $proj '.gitignore') -Value 'my-own-ignore-rule/'
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -Uninstall -ProjectDir $proj -Yes
          $status = $LASTEXITCODE
          if ($status -ne 0) { Write-Host "::error::-Uninstall exited $status"; exit 1 }
          if (Test-Path -LiteralPath $forgeBin -PathType Container) { Write-Host '::error::.claude\forge-bin still exists after -Uninstall'; exit 1 }
          Write-Host 'ok   .claude\forge-bin is gone'
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { Write-Host '::error::a file the user created was deleted by -Uninstall'; exit 1 }
          Write-Host 'ok   the user-created file survived'
          $editedText = Get-Content -Raw -LiteralPath $edited
          if ($editedText -notmatch 'my own edit, kept across uninstall') { Write-Host '::error::the user-edited payload file was deleted or reverted by -Uninstall'; exit 1 }
          Write-Host 'ok   the user-edited payload file survived, unchanged'
          $giLines = Get-Content -LiteralPath (Join-Path $proj '.gitignore')
          if ($giLines -contains '.claude/forge-runs/*/*') { Write-Host '::error::a Forge-added .gitignore line survived -Uninstall'; exit 1 }
          if ($giLines -notcontains 'my-own-ignore-rule/') { Write-Host "::error::the user's own .gitignore line was removed by -Uninstall"; exit 1 }
          Write-Host "ok   Forge's .gitignore lines are gone, the user's own line stayed"
          $before = @(Get-ChildItem -LiteralPath (Join-Path $proj '.claude') -Recurse -File | ForEach-Object { $_.FullName }) | Sort-Object
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -Uninstall -ProjectDir $proj -Yes | Out-Null
          $status2 = $LASTEXITCODE
          if ($status2 -ne 0) { Write-Host "::error::a second -Uninstall exited $status2"; exit 1 }
          $after = @(Get-ChildItem -LiteralPath (Join-Path $proj '.claude') -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }) | Sort-Object
          if (($before -join "`n") -ne ($after -join "`n")) { Write-Host '::error::a second -Uninstall changed the file set (not idempotent)'; exit 1 }
          Write-Host 'ok   a second -Uninstall is a no-op'
          exit 0

      # v2.8.0 upgrade path (laptop re-audit N8/D1): a project installed by an OLD (2.7.2-shaped) release
      # has cwd-relative hook commands with no $CLAUDE_PROJECT_DIR and no separate PowerShell matcher. The
      # merge must recognise those as the SAME hook (just an older form) and normalise them, never leave the
      # old form in place AND add a second, duplicate entry for the same script under the same matcher.
      # NOTE: this assertion will only pass once the settings-merge tool's own upgrade-recognition change
      # (owned by a different work package) has been synced into this dist copy -- written correctly now so
      # it starts passing the moment that lands, instead of being invented later.
      - name: Upgrading a 2.7.2-shaped settings.json de-duplicates hooks into the $CLAUDE_PROJECT_DIR form (POSIX)
        if: runner.os != 'Windows'
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
        run: |
          set -e
          proj="$RUNNER_TEMP/upgrade-project"
          mkdir -p "$proj/.claude"
          cat > "$proj/.claude/settings.json" <<'OLDSETTINGS'
          {
            "hooks": {
              "PreCompact": [
                { "matcher": "manual", "hooks": [ { "type": "command", "command": "node .claude/forge-bin/forge-snapshot-marker.cjs", "timeout": 15 } ] },
                { "matcher": "auto",   "hooks": [ { "type": "command", "command": "node .claude/forge-bin/forge-snapshot-marker.cjs", "timeout": 15 } ] }
              ],
              "SessionStart": [
                { "matcher": "compact", "hooks": [ { "type": "command", "command": "node .claude/forge-bin/forge-snapshot-reinject.cjs", "timeout": 15 } ] }
              ],
              "PostToolUse": [
                { "matcher": "Write|Edit|MultiEdit|NotebookEdit|Bash", "hooks": [ { "type": "command", "command": "node .claude/forge-bin/forge-toolhook.cjs", "timeout": 10 } ] }
              ],
              "PreToolUse": [
                { "matcher": "Bash", "hooks": [ { "type": "command", "command": "node .claude/forge-bin/forge-gate-hook.cjs", "timeout": 10 } ] }
              ]
            }
          }
          OLDSETTINGS
          bash install.sh --project "$proj" --yes >/dev/null
          node tests/installer/assert-hook-dedup.js "$proj/.claude/settings.json" || {
            echo "::warning::hook de-duplication on upgrade is not green yet -- expected until the settings-merge tool's upgrade-recognition change is synced into this dist copy (see the step comment)";
            exit 1;
          }

      - name: Upgrading a 2.7.2-shaped settings.json de-duplicates hooks into the $CLAUDE_PROJECT_DIR form (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HOME: ${{ env.FORGE_TEST_HOME }}
          USERPROFILE: ${{ env.FORGE_TEST_HOME }}
        run: |
          $proj = Join-Path $env:RUNNER_TEMP 'upgrade-project'
          New-Item -ItemType Directory -Force (Join-Path $proj '.claude') | Out-Null
          $old = @'
          {
            "hooks": {
              "PreCompact": [
                { "matcher": "manual", "hooks": [ { "type": "command", "command": "node .claude/forge-bin/forge-snapshot-marker.cjs", "timeout": 15 } ] },
                { "matcher": "auto",   "hooks": [ { "type": "command", "command": "node .claude/forge-bin/forge-snapshot-marker.cjs", "timeout": 15 } ] }
              ],
              "SessionStart": [
                { "matcher": "compact", "hooks": [ { "type": "command", "command": "node .claude/forge-bin/forge-snapshot-reinject.cjs", "timeout": 15 } ] }
              ],
              "PostToolUse": [
                { "matcher": "Write|Edit|MultiEdit|NotebookEdit|Bash", "hooks": [ { "type": "command", "command": "node .claude/forge-bin/forge-toolhook.cjs", "timeout": 10 } ] }
              ],
              "PreToolUse": [
                { "matcher": "Bash", "hooks": [ { "type": "command", "command": "node .claude/forge-bin/forge-gate-hook.cjs", "timeout": 10 } ] }
              ]
            }
          }
          '@
          $settingsPath = Join-Path $proj '.claude\settings.json'
          [System.IO.File]::WriteAllText($settingsPath, $old, (New-Object System.Text.UTF8Encoding $false))
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -ProjectDir $proj -Yes | Out-Null
          node tests/installer/assert-hook-dedup.js $settingsPath
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Host '::warning::hook de-duplication on upgrade is not green yet -- expected until the settings-merge tool''s upgrade-recognition change is synced into this dist copy (see the step comment)'
            exit 1
          }
          exit 0
